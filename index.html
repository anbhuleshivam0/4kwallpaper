<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4K Wallpaper - Premium HD Wallpapers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm"></script>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect fill='%23000' width='256' height='256' rx='60'/><text x='128' y='160' font-size='100' font-weight='bold' text-anchor='middle' fill='white'>4</text><circle cx='200' cy='60' r='25' fill='%231e40af'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #ffffff;
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .falcon-icon {
            display: inline-block;
            width: 40px;
            height: 40px;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .post-card {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            transition: box-shadow 0.3s ease;
            height: 350px;
        }

        .post-card:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .post-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background: #f3f4f6;
        }

        .post-info {
            padding: 1rem;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .post-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1f2937;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .post-category {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .modal-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-modal:hover {
            transform: scale(1.2);
        }

        .loading-skeleton {
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .no-posts {
            text-align: center;
            padding: 4rem 2rem;
            color: #9ca3af;
        }

        @media (max-width: 768px) {
            .posts-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <svg class="falcon-icon" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                    <rect fill="#000" width="256" height="256" rx="60"/>
                    <text x="128" y="160" font-size="100" font-weight="bold" text-anchor="middle" fill="white">4</text>
                    <circle cx="200" cy="60" r="25" fill="#1e40af"/>
                </svg>
                <h1 class="text-2xl font-bold text-gray-900">4K Wallpapers</h1>
            </div>
            <div class="flex-1 max-w-md">
                <input type="text" id="searchInput" placeholder="Search..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:border-gray-500 focus:outline-none transition">
            </div>
        </div>
    </header>

    <!-- Posts Grid -->
    <main class="max-w-7xl mx-auto">
        <div id="postsGrid" class="posts-grid">
            <!-- Posts will be loaded here -->
            <div class="post-card loading-skeleton"></div>
            <div class="post-card loading-skeleton"></div>
            <div class="post-card loading-skeleton"></div>
        </div>
        <div id="noPosts" class="no-posts" style="display: none;">
            <p class="text-lg">No wallpapers found</p>
        </div>
    </main>

    <!-- Image Viewer Modal -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeImageModal">&times;</span>
            <img id="modalImage" class="modal-image" src="" alt="">
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-50 border-t border-gray-200 mt-16">
        <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-2">
                    <svg class="falcon-icon" style="width: 30px; height: 30px;" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                        <rect fill="#000" width="256" height="256" rx="60"/>
                        <text x="128" y="160" font-size="100" font-weight="bold" text-anchor="middle" fill="white">4</text>
                        <circle cx="200" cy="60" r="25" fill="#1e40af"/>
                    </svg>
                    <span class="font-semibold text-gray-900">4K Wallpapers</span>
                </div>
                <p class="text-sm text-gray-600">&copy; 2024 All rights reserved</p>
            </div>
        </div>
    </footer>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://srdzebzqrtwnmuzsnhdz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyZHplYnpxcnR3bm11enNuaGR6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDgxMjU2MCwiZXhwIjoyMDk2Mzg4NTYwfQ.jiAK-grCpzfQC2U4uPxHiaKeJsPXAhO7747PuC6dm-E';
        
        let supabase = null;
        let allPosts = [];

        // Initialize Supabase
        async function initSupabase() {
            const { createClient } = window.supabase;
            supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
            loadPosts();
        }

        // Load posts from Supabase
        async function loadPosts() {
            if (!supabase) return;
            
            try {
                const { data, error } = await supabase
                    .from('wallpapers')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    console.error('Error loading posts:', error);
                    return;
                }
                
                allPosts = data || [];
                renderPosts(allPosts);
            } catch (err) {
                console.error('Error:', err);
            }
        }

        // Render posts to grid
        function renderPosts(posts) {
            const grid = document.getElementById('postsGrid');
            const noPosts = document.getElementById('noPosts');
            
            if (posts.length === 0) {
                grid.innerHTML = '';
                noPosts.style.display = 'block';
                return;
            }
            
            noPosts.style.display = 'none';
            grid.innerHTML = posts.map(post => `
                <div class="post-card cursor-pointer" onclick="openImageModal('${post.image_url}', '${escapeHtml(post.title)}')">
                    <img src="${post.image_url}" alt="${post.title}" class="post-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 300%22%3E%3Crect fill=%22%23f3f4f6%22 width=%22400%22 height=%22300%22/%3E%3C/svg%3E'">
                    <div class="post-info">
                        <div>
                            <p class="post-title">${escapeHtml(post.title)}</p>
                            <p class="post-category">${escapeHtml(post.category)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allPosts.filter(post => 
                post.title.toLowerCase().includes(searchTerm) || 
                post.category.toLowerCase().includes(searchTerm)
            );
            renderPosts(filtered);
        });

        // Modal functions
        function openImageModal(imageUrl, title) {
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        document.getElementById('closeImageModal').addEventListener('click', () => {
            closeModal('imageModal');
        });

        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('imageModal')) {
                closeModal('imageModal');
            }
        });

        // Initialize
        initSupabase();
    </script>
</body>
</html>
